openapi: 3.0.3
info:
  title: NoteFlow API
  version: 1.0.0
servers:
  - url: /
    description: Same-origin NoteFlow deployment
externalDocs:
  description: "Bắt buộc: flow browser CSRF Sanctum và xử lý HTTP 419"
  url: ../docs/deployment/csrf-and-419.md
paths:
  /login:
    post:
      operationId: loginOwner
      summary: Create a session for the provisioned NoteFlow owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Owner session created
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '429':
          description: Too many login attempts
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /logout:
    post:
      operationId: logoutOwner
      summary: Invalidate the active owner session
      security:
        - sanctumCookie: []
      responses:
        '204':
          description: Owner session invalidated
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
  /api/v1/session:
    get:
      operationId: getOwnerSession
      summary: Resolve the authenticated owner session
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: Authenticated owner session
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/foundation:
    get:
      operationId: foundationHealth
      summary: Verify that the NoteFlow API foundation is available
      security: []
      responses:
        '200':
          description: Foundation is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundationHealth'
  /api/v1/account:
    get:
      operationId: getAccountContext
      summary: Resolve the owner account date and Monday-to-Sunday week
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: Server-authoritative account time context
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/challenges:
    get:
      operationId: getChallenges
      summary: List challenges for the authenticated owner
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: List of challenges
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeListResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createChallenge
      summary: Create a new challenge
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeRequest'
      responses:
        '201':
          description: Challenge created successfully
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/ChallengeProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/StateProblemDetails'
  /api/v1/challenges/{id}:
    get:
      operationId: getChallenge
      summary: Get challenge details
      security:
        - sanctumCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Challenge detail
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeDetailResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Challenge not found
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: updateChallengeMetadata
      summary: Update challenge name and description
      security:
        - sanctumCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChallengeMetadataRequest'
      responses:
        '200':
          description: Challenge metadata updated successfully
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Challenge not found
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/ChallengeProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/StateProblemDetails'
  /api/v1/challenges/{id}/journals/{date}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: path
        required: true
        description: The date must be within the challenge start date through the server-authoritative account date.
        schema:
          type: string
          format: date
    get:
      operationId: getChallengeJournal
      summary: Read the optional journal for one challenge day
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: Journal state, including version zero when absent
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalReadResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Challenge not found
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      operationId: saveChallengeJournal
      summary: Save or edit a journal without changing completion
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveJournalRequest'
      responses:
        '200':
          description: Journal saved or prior command acknowledgement replayed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Challenge not found
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/JournalProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/StateProblemDetails'
  /api/v1/challenges/{id}/completions/{date}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: path
        required: true
        description: Must be the server-authoritative account date; other dates are rejected until backfill is supported.
        schema:
          type: string
          format: date
    put:
      operationId: markChallengeCompletion
      summary: Mark account-today Done without a journal
      description: >-
        Repeating Done for a day that is already Done succeeds without a new completion,
        completion version or account revision. An identical command replays its stored
        acknowledgement; a reused command ID with a different payload is rejected.
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkCompletionRequest'
      responses:
        '200':
          description: Done recorded, already Done, or prior command acknowledgement replayed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Challenge not found
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/StateProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/StateProblemDetails'
  /api/v1/notebooks:
    get:
      operationId: getNotebooks
      summary: List the owner's one-level notebooks
      description: >-
        The default notebook comes first, then notebooks by created_at and id
        ascending. Exactly one notebook has is_default true; clients label it
        from that flag, never from its name.
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: Notebook list
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookListResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createNotebook
      summary: Create a one-level, non-default notebook
      description: >-
        The name is trimmed and may repeat. An identical command replays its
        stored acknowledgement; a reused command ID with a different payload is
        rejected.
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotebookRequest'
      responses:
        '201':
          description: Notebook created or prior command acknowledgement replayed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/StateProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/StateProblemDetails'
  /api/v1/notebooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameNotebook
      summary: Rename a notebook, including the default notebook
      description: Renaming never changes is_default. Renaming to the same trimmed name keeps row_version and account_revision.
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameNotebookRequest'
      responses:
        '200':
          description: Notebook renamed or prior command acknowledgement replayed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Notebook not found for this owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/NotebookRenameProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/StateProblemDetails'
    delete:
      operationId: deleteNotebook
      summary: Delete an empty, non-default notebook
      description: >-
        The command travels in the JSON body. The default notebook and a
        notebook that still has notes are refused with notebook_is_default or
        notebook_not_empty.
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteNotebookRequest'
      responses:
        '200':
          description: Notebook deleted or prior command acknowledgement replayed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookDeletionResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Notebook not found for this owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/NotebookDeleteProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/StateProblemDetails'
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: noteflow-session
      description: Laravel Sanctum first-party SPA session cookie. Unsafe requests also require XSRF protection.
  headers:
    PrivateNoStore:
      description: Prevents private owner data from being cached.
      schema:
        type: string
        pattern: '^(private, ?no-store|no-store, ?private)$'
  responses:
    Unauthenticated:
      description: No valid owner session
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Request validation or credentials failed
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    StateProblemDetails:
      description: Domain state conflict, fence or idempotency key reuse without a resource snapshot
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StateProblemDetails'
    ChallengeProblemDetails:
      description: Challenge mutation conflict or state problem
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ChallengeProblemDetails'
    JournalProblemDetails:
      description: Journal mutation conflict or state problem
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/JournalProblemDetails'
    NotebookRenameProblemDetails:
      description: Notebook rename conflict or state problem
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotebookRenameProblemDetails'
    NotebookDeleteProblemDetails:
      description: Notebook delete refusal, conflict or state problem
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotebookDeleteProblemDetails'
    CsrfExpired:
      description: CSRF session expired or token mismatched
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    JournalSnapshot:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - local_date
        - journal
        - journal_version
      properties:
        challenge_id:
          type: string
          format: uuid
        local_date:
          type: string
          format: date
        journal:
          type: string
          nullable: true
        journal_version:
          type: integer
          minimum: 0
    JournalReadResult:
      type: object
      additionalProperties: false
      required:
        - journal
      properties:
        journal:
          $ref: '#/components/schemas/JournalSnapshot'
    JournalMutationResult:
      type: object
      additionalProperties: false
      required:
        - journal
        - account_revision
        - data_epoch
      properties:
        journal:
          $ref: '#/components/schemas/JournalSnapshot'
        account_revision:
          type: integer
          minimum: 0
        data_epoch:
          type: integer
          minimum: 1
    SaveJournalRequest:
      type: object
      additionalProperties: false
      required:
        - command_id
        - data_epoch
        - base_version
        - journal
      properties:
        command_id:
          type: string
          format: uuid
        data_epoch:
          type: integer
          minimum: 1
        base_version:
          type: integer
          minimum: 0
        journal:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    AccountContext:
      type: object
      additionalProperties: false
      required:
        - timezone
        - account_date
        - week
        - account_revision
        - data_epoch
        - write_state
      properties:
        timezone:
          type: string
          enum:
            - Asia/Ho_Chi_Minh
        account_date:
          type: string
          format: date
        week:
          $ref: '#/components/schemas/AccountWeek'
        account_revision:
          type: integer
          minimum: 0
        data_epoch:
          type: integer
          minimum: 1
        write_state:
          type: string
          enum:
            - open
            - locked_for_import
    AccountWeek:
      type: object
      additionalProperties: false
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    Owner:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
    OwnerSession:
      type: object
      additionalProperties: false
      required:
        - owner
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        redirect_to:
          type: string
          nullable: true
    LoginResult:
      type: object
      additionalProperties: false
      required:
        - owner
        - redirect_to
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        redirect_to:
          type: string
          enum:
            - /today
            - /challenges
            - /notes
            - /calendar
            - /settings
    ApiError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - csrf_expired
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    FoundationHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - noteflow-api
    Challenge:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - start_date
        - target_days
        - row_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        target_days:
          type: integer
          minimum: 1
          maximum: 7
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChallengeSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - start_date
        - target_days
        - row_version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        target_days:
          type: integer
          minimum: 1
          maximum: 7
