openapi: 3.0.3
info:
  title: NoteFlow API
  version: 1.0.0
servers:
  - url: /
    description: Same-origin NoteFlow deployment
paths:
  /login:
    post:
      operationId: loginOwner
      summary: Create a session for the provisioned NoteFlow owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Owner session created
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '419':
          $ref: '#/components/responses/CsrfExpired'
        '429':
          description: Too many login attempts
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /logout:
    post:
      operationId: logoutOwner
      summary: Invalidate the active owner session
      security:
        - sanctumCookie: []
      responses:
        '204':
          description: Owner session invalidated
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfExpired'
  /api/v1/session:
    get:
      operationId: getOwnerSession
      summary: Resolve the authenticated owner session
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: Authenticated owner session
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/foundation:
    get:
      operationId: foundationHealth
      summary: Verify that the NoteFlow API foundation is available
      security: []
      responses:
        '200':
          description: Foundation is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundationHealth'
  /api/v1/account:
    get:
      operationId: getAccountContext
      summary: Resolve the owner account date and Monday-to-Sunday week
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: Server-authoritative account time context
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/challenges:
    get:
      operationId: getChallenges
      summary: List challenges for the authenticated owner
      security:
        - sanctumCookie: []
      responses:
        '200':
          description: List of challenges
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeListResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createChallenge
      summary: Create a new challenge
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeRequest'
      responses:
        '201':
          description: Challenge created successfully
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/ProblemDetails'
  /api/v1/challenges/{id}:
    get:
      operationId: getChallenge
      summary: Get challenge details
      security:
        - sanctumCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Challenge detail
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeDetailResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Challenge not found
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: updateChallengeMetadata
      summary: Update challenge name and description
      security:
        - sanctumCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChallengeMetadataRequest'
      responses:
        '200':
          description: Challenge metadata updated successfully
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeMutationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Authenticated identity is not the provisioned owner
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Challenge not found
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/ProblemDetails'
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: noteflow-session
      description: Laravel Sanctum first-party SPA session cookie. Unsafe requests also require XSRF protection.
  headers:
    PrivateNoStore:
      description: Prevents private owner data from being cached.
      schema:
        type: string
        pattern: '(^|, ?)(private|no-store)'
  responses:
    Unauthenticated:
      description: No valid owner session
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Request validation or credentials failed
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    ProblemDetails:
      description: Domain or state conflict, fence or key reuse
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CsrfExpired:
      description: CSRF session expired or token mismatched
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    AccountContext:
      type: object
      additionalProperties: false
      required:
        - timezone
        - account_date
        - week
        - account_revision
        - data_epoch
        - write_state
      properties:
        timezone:
          type: string
          enum:
            - Asia/Ho_Chi_Minh
        account_date:
          type: string
          format: date
        week:
          $ref: '#/components/schemas/AccountWeek'
        account_revision:
          type: integer
          minimum: 0
        data_epoch:
          type: integer
          minimum: 1
        write_state:
          type: string
          enum:
            - open
            - locked_for_import
    AccountWeek:
      type: object
      additionalProperties: false
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    Owner:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
    OwnerSession:
      type: object
      additionalProperties: false
      required:
        - owner
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        redirect_to:
          type: string
          nullable: true
    LoginResult:
      type: object
      additionalProperties: false
      required:
        - owner
        - redirect_to
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        redirect_to:
          type: string
          enum:
            - /today
            - /challenges
            - /notes
            - /calendar
            - /settings
    ApiError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - csrf_expired
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    FoundationHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - noteflow-api
    Challenge:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - start_date
        - target_days
        - row_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        target_days:
          type: integer
          minimum: 1
          maximum: 7
        row_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChallengeSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - start_date
        - target_days
        - row_version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        target_days:
          type: integer
          minimum: 1
          maximum: 7
        row_version:
          type: integer
          minimum: 1
    ChallengeListResult:
      type: object
      additionalProperties: false
      required:
        - challenges
      properties:
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/Challenge'
    ChallengeDetailResult:
      type: object
      additionalProperties: false
      required:
        - challenge
      properties:
        challenge:
          $ref: '#/components/schemas/Challenge'
    ChallengeMutationResult:
      type: object
      additionalProperties: false
      required:
        - challenge
        - account_revision
        - data_epoch
      properties:
        challenge:
          $ref: '#/components/schemas/Challenge'
        account_revision:
          type: integer
          minimum: 0
        data_epoch:
          type: integer
          minimum: 1
    CreateChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - command_id
        - data_epoch
        - name
        - target_days
      properties:
        command_id:
          type: string
          format: uuid
        data_epoch:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
          nullable: true
        target_days:
          type: integer
          minimum: 1
          maximum: 7
    UpdateChallengeMetadataRequest:
      type: object
      additionalProperties: false
      required:
        - command_id
        - data_epoch
        - base_version
        - name
      properties:
        command_id:
          type: string
          format: uuid
        data_epoch:
          type: integer
          minimum: 1
        base_version:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
          nullable: true
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - version_conflict
            - stale_data_epoch
            - idempotency_key_reused
            - write_fence_active
        resource_id:
          type: string
          format: uuid
        current_version:
          type: integer
        current_snapshot:
          $ref: '#/components/schemas/ChallengeSnapshot'
