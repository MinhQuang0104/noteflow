name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: noteflow_test
          POSTGRES_USER: noteflow
          POSTGRES_PASSWORD: noteflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noteflow -d noteflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: noteflow_test
      DB_USERNAME: noteflow
      DB_PASSWORD: noteflow
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
      - run: composer --working-dir=backend validate --strict
      - run: composer --working-dir=backend install --no-interaction --prefer-dist --no-progress
      - run: backend/vendor/bin/pint --test
      - run: composer --working-dir=backend analyse
      - run: php artisan test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run contract:validate
        working-directory: frontend
      - run: npm run contract:check
        working-directory: frontend
      - run: npm run contract:proof
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run test:unit -- --run
        working-directory: frontend
      - run: npm run build-only
        working-directory: frontend

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - run: composer --working-dir=backend install --no-interaction --prefer-dist --no-progress
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker run --rm --add-host php-fpm:127.0.0.1
          -v "$PWD/deploy/nginx/noteflow.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t
